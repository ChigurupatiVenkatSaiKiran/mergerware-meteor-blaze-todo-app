<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mergerware Blaze To-Do App — Live Demo</title>
  <meta name="description" content="A beautiful, reactive to-do app built with Meteor.js and Blaze for the Mergerware assessment. Featuring task categories, drag-and-drop reordering, and real-time updates.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="main.css">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
</head>
<body>
  <div class="app-layout">

    <!-- ══════════════ SIDEBAR ══════════════ -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon">⚡</span>
        <span class="brand-name">Mergerware</span>
      </div>

      <nav class="sidebar-nav">
        <p class="nav-label">Categories</p>

        <!-- All Tasks Filter -->
        <button id="filter-all" class="nav-item active" data-category="all">
          <span class="nav-icon">🗂️</span>
          <span class="nav-text">All Tasks</span>
          <span class="nav-badge" id="badge-all">0</span>
        </button>

        <!-- Category Filters -->
        <button id="filter-work" class="nav-item cat-Work" data-category="Work">
          <span class="nav-icon">💼</span>
          <span class="nav-text">Work</span>
          <span class="nav-badge" id="badge-work">0</span>
        </button>

        <button id="filter-personal" class="nav-item cat-Personal" data-category="Personal">
          <span class="nav-icon">🏠</span>
          <span class="nav-text">Personal</span>
          <span class="nav-badge" id="badge-personal">0</span>
        </button>

        <button id="filter-urgent" class="nav-item cat-Urgent" data-category="Urgent">
          <span class="nav-icon">🔥</span>
          <span class="nav-text">Urgent</span>
          <span class="nav-badge" id="badge-urgent">0</span>
        </button>

        <button id="filter-other" class="nav-item cat-Other" data-category="Other">
          <span class="nav-icon">📌</span>
          <span class="nav-text">Other</span>
          <span class="nav-badge" id="badge-other">0</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="progress-ring-wrap">
          <svg class="progress-ring" viewBox="0 0 60 60">
            <circle class="progress-ring-bg" cx="30" cy="30" r="26"/>
            <circle id="progress-fill" class="progress-ring-fill" cx="30" cy="30" r="26" stroke-dasharray="0 163.36"/>
          </svg>
          <span class="progress-label" id="progress-label">0%</span>
        </div>
        <div class="progress-text" id="progress-text">
          <strong>0</strong> of <strong>0</strong> done
        </div>
      </div>
    </aside>

    <!-- ══════════════ MAIN CONTENT ══════════════ -->
    <main class="main-content">

      <!-- Header -->
      <header class="main-header">
        <div class="header-left">
          <h1 class="main-title" id="main-title">All Tasks</h1>
          <p class="main-subtitle" id="main-subtitle">0 tasks remaining</p>
        </div>
        <div class="header-actions">
          <label class="toggle-completed-label">
            <input id="toggle-hide-completed" type="checkbox" class="toggle-checkbox">
            <span class="toggle-track">
              <span class="toggle-thumb"></span>
            </span>
            <span class="toggle-text">Hide done</span>
          </label>
        </div>
      </header>

      <!-- Add Task Form -->
      <form class="add-task-form" id="add-task-form">
        <div class="form-inner">
          <div class="form-input-wrap">
            <span class="form-input-icon">✏️</span>
            <input
              id="task-text-input"
              class="task-input"
              type="text"
              placeholder="What needs to be done?"
              autocomplete="off"
            >
          </div>
          <div class="form-select-wrap">
            <select id="task-category-select" class="category-select">
              <option value="Work">💼 Work</option>
              <option value="Personal">🏠 Personal</option>
              <option value="Urgent">🔥 Urgent</option>
              <option value="Other">📌 Other</option>
            </select>
          </div>
          <button id="add-task-btn" type="submit" class="add-btn">
            <span>+</span> Add
          </button>
        </div>
      </form>

      <!-- Task List Container -->
      <ul class="task-list" id="task-list"></ul>

      <!-- Empty State -->
      <div class="empty-state" id="empty-state" style="display: none;">
        <div class="empty-icon">🎉</div>
        <h2 class="empty-title" id="empty-title">No tasks yet</h2>
        <p class="empty-desc">Add your first task above to get started!</p>
      </div>

    </main>
  </div>

  <script>
    // ══════════════════════════════════════════════════════════════
    // Mergerware State & Reactivity Controller
    // ══════════════════════════════════════════════════════════════

    const CATEGORY_ICONS = {
      Work: '💼',
      Personal: '🏠',
      Urgent: '🔥',
      Other: '📌'
    };

    const INITIAL_TASKS = [
      { id: '1', text: 'Prepare quarterly merger review slide deck', category: 'Work', checked: false, order: 0 },
      { id: '2', text: 'Schedule team sync for Q3 product roadmap', category: 'Work', checked: true, order: 1 },
      { id: '3', text: 'Pick up groceries and organic coffee', category: 'Personal', checked: false, order: 2 },
      { id: '4', text: 'Renew cloud security certificate (SSL/TLS)', category: 'Urgent', checked: false, order: 3 },
      { id: '5', text: 'Review Blaze vs React architectural benchmark report', category: 'Other', checked: false, order: 4 }
    ];

    let tasks = JSON.parse(localStorage.getItem('mergerware_tasks')) || INITIAL_TASKS;
    let activeCategory = 'all';
    let hideCompleted = false;

    function saveTasks() {
      localStorage.setItem('mergerware_tasks', JSON.stringify(tasks));
      render();
    }

    function getFilteredTasks() {
      return tasks
        .filter(t => {
          if (activeCategory !== 'all' && t.category !== activeCategory) return false;
          if (hideCompleted && t.checked) return false;
          return true;
        })
        .sort((a, b) => a.order - b.order);
    }

    function render() {
      const filtered = getFilteredTasks();
      const listEl = document.getElementById('task-list');
      const emptyEl = document.getElementById('empty-state');

      // Update Counts
      const total = tasks.length;
      const completed = tasks.filter(t => t.checked).length;
      const remaining = total - completed;

      document.getElementById('badge-all').textContent = total;
      document.getElementById('badge-work').textContent = tasks.filter(t => t.category === 'Work').length;
      document.getElementById('badge-personal').textContent = tasks.filter(t => t.category === 'Personal').length;
      document.getElementById('badge-urgent').textContent = tasks.filter(t => t.category === 'Urgent').length;
      document.getElementById('badge-other').textContent = tasks.filter(t => t.category === 'Other').length;

      // Update Progress Ring
      const pct = total === 0 ? 0 : Math.round((completed / total) * 100);
      const circumference = 2 * Math.PI * 26; // ≈ 163.36
      const fillAmount = (pct / 100) * circumference;
      document.getElementById('progress-fill').setAttribute('stroke-dasharray', `${fillAmount} ${circumference}`);
      document.getElementById('progress-label').textContent = `${pct}%`;
      document.getElementById('progress-text').innerHTML = `<strong>${completed}</strong> of <strong>${total}</strong> done`;

      // Update Header
      const title = activeCategory === 'all' ? 'All Tasks' : `${activeCategory} Tasks`;
      document.getElementById('main-title').textContent = title;
      document.getElementById('main-subtitle').textContent = `${remaining} task${remaining === 1 ? '' : 's'} remaining`;

      // Render Task List or Empty State
      if (filtered.length === 0) {
        listEl.innerHTML = '';
        emptyEl.style.display = 'flex';
        document.getElementById('empty-title').textContent = activeCategory === 'all' ? 'No tasks yet' : `No ${activeCategory} tasks`;
      } else {
        emptyEl.style.display = 'none';
        listEl.innerHTML = filtered.map(t => `
          <li class="task-item ${t.checked ? 'task-checked' : ''} cat-${t.category}" data-id="${t.id}">
            <span class="drag-handle" title="Drag to reorder">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <circle cx="5" cy="4" r="1.5" fill="currentColor"/>
                <circle cx="11" cy="4" r="1.5" fill="currentColor"/>
                <circle cx="5" cy="8" r="1.5" fill="currentColor"/>
                <circle cx="11" cy="8" r="1.5" fill="currentColor"/>
                <circle cx="5" cy="12" r="1.5" fill="currentColor"/>
                <circle cx="11" cy="12" r="1.5" fill="currentColor"/>
              </svg>
            </span>
            <label class="task-checkbox-wrap">
              <input type="checkbox" class="task-checkbox" data-id="${t.id}" ${t.checked ? 'checked' : ''}>
              <span class="task-checkbox-custom"></span>
            </label>
            <span class="task-text ${t.checked ? 'task-text-done' : ''}" title="Double-click to edit" data-id="${t.id}">${escapeHtml(t.text)}</span>
            <span class="category-badge cat-badge-${t.category}">
              ${CATEGORY_ICONS[t.category] || '📌'} ${t.category}
            </span>
            <button class="delete-btn" data-id="${t.id}" title="Delete task" aria-label="Delete task">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M2 2L12 12M12 2L2 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </button>
          </li>
        `).join('');
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ── Form Add Task ──
    document.getElementById('add-task-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('task-text-input');
      const select = document.getElementById('task-category-select');
      const text = input.value.trim();
      if (!text) return;

      const maxOrder = tasks.reduce((max, t) => Math.max(max, t.order || 0), 0);
      tasks.push({
        id: Date.now().toString(),
        text: text,
        category: select.value,
        checked: false,
        order: maxOrder + 1
      });

      input.value = '';
      saveTasks();
    });

    // ── Checkbox Toggle & Delete & Inline Edit ──
    const listEl = document.getElementById('task-list');

    listEl.addEventListener('change', (e) => {
      if (e.target.classList.contains('task-checkbox')) {
        const id = e.target.dataset.id;
        const task = tasks.find(t => t.id === id);
        if (task) {
          task.checked = e.target.checked;
          saveTasks();
        }
      }
    });

    listEl.addEventListener('click', (e) => {
      const delBtn = e.target.closest('.delete-btn');
      if (delBtn) {
        const id = delBtn.dataset.id;
        const item = delBtn.closest('.task-item');
        item.classList.add('task-item-removing');
        setTimeout(() => {
          tasks = tasks.filter(t => t.id !== id);
          saveTasks();
        }, 200);
      }
    });

    listEl.addEventListener('dblclick', (e) => {
      const textSpan = e.target.closest('.task-text');
      if (!textSpan) return;

      const id = textSpan.dataset.id;
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      const currentText = task.text;
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'inline-edit-input';
      input.value = currentText;

      textSpan.replaceWith(input);
      input.focus();
      input.select();

      function commitEdit() {
        const newText = input.value.trim();
        if (newText && newText !== currentText) {
          task.text = newText;
          saveTasks();
        } else {
          render();
        }
      }

      input.addEventListener('blur', commitEdit);
      input.addEventListener('keydown', (ke) => {
        if (ke.key === 'Enter') {
          input.removeEventListener('blur', commitEdit);
          commitEdit();
        } else if (ke.key === 'Escape') {
          input.removeEventListener('blur', commitEdit);
          render();
        }
      });
    });

    // ── Category Sidebar Filters ──
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategory = btn.dataset.category;
        render();
      });
    });

    // ── Toggle Hide Completed ──
    document.getElementById('toggle-hide-completed').addEventListener('change', (e) => {
      hideCompleted = e.target.checked;
      render();
    });

    // ── Drag & Drop Reordering via SortableJS ──
    Sortable.create(listEl, {
      handle: '.drag-handle',
      animation: 150,
      ghostClass: 'task-ghost',
      dragClass: 'task-dragging',
      onEnd() {
        const itemEls = listEl.querySelectorAll('.task-item[data-id]');
        const idOrder = Array.from(itemEls).map(el => el.dataset.id);
        idOrder.forEach((id, idx) => {
          const t = tasks.find(item => item.id === id);
          if (t) t.order = idx;
        });
        localStorage.setItem('mergerware_tasks', JSON.stringify(tasks));
      }
    });

    // Initial render
    render();
  </script>
</body>
</html>
