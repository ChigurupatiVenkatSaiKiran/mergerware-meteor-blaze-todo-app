<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <!-- Definitions for Gradients and Shadows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Component Gradient: Client -->
    <linearGradient id="client-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.8" />
    </linearGradient>

    <!-- Component Gradient: Server -->
    <linearGradient id="server-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0.8" />
    </linearGradient>

    <!-- Component Gradient: DB -->
    <linearGradient id="db-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.8" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accent-indigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    
    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="850" height="480" rx="16" fill="url(#bg-grad)" />
  <rect width="850" height="480" rx="16" fill="url(#grid)" />

  <!-- Outer Border Glow -->
  <rect x="1" y="1" width="848" height="478" rx="15" fill="none" stroke="url(#accent-indigo)" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Header -->
  <text x="30" y="45" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" letter-spacing="0.5">
    Mergerware System Architecture
  </text>
  <text x="30" y="65" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#94a3b8" font-weight="500">
    Meteor 3.x Real-Time DDP Publication &amp; Async Database Engine
  </text>

  <!-- ==================== CLIENT NODE ==================== -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <!-- Container -->
    <rect width="240" height="310" rx="12" fill="url(#client-grad)" stroke="#4f46e5" stroke-width="1.5" stroke-opacity="0.6" />
    <!-- Header -->
    <rect width="240" height="40" rx="12" fill="#312e81" />
    <text x="120" y="25" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      Client (Browser Window)
    </text>
    
    <!-- Subcomponents -->
    <g transform="translate(15, 60)">
      <!-- Blaze View Engine -->
      <rect width="210" height="45" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
      <text x="25" y="27" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Blaze Templates</text>
      <text x="25" y="39" font-family="'Inter', sans-serif" font-size="9" fill="#a5b4fc">Reactive UI Compilation</text>
      <circle cx="15" cy="27" r="4" fill="#ff8c00" />

      <!-- Tracker & Minimongo -->
      <g transform="translate(0, 55)">
        <rect width="210" height="45" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
        <text x="25" y="27" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Minimongo &amp; Tracker</text>
        <text x="25" y="39" font-family="'Inter', sans-serif" font-size="9" fill="#a5b4fc">Client In-Memory Database</text>
        <circle cx="15" cy="27" r="4" fill="#a855f7" />
      </g>

      <!-- SortableJS drag & drop -->
      <g transform="translate(0, 110)">
        <rect width="210" height="45" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
        <text x="25" y="27" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">SortableJS Drag Controller</text>
        <text x="25" y="39" font-family="'Inter', sans-serif" font-size="9" fill="#a5b4fc">Reorder Events &amp; Handles</text>
        <circle cx="15" cy="27" r="4" fill="#10b981" />
      </g>

      <!-- Connection Manager -->
      <g transform="translate(0, 165)">
        <rect width="210" height="45" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
        <text x="25" y="27" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">callAsync Handler</text>
        <text x="25" y="39" font-family="'Inter', sans-serif" font-size="9" fill="#a5b4fc">Optimistic UI Stub Execution</text>
        <circle cx="15" cy="27" r="4" fill="#6366f1" />
      </g>
    </g>
  </g>

  <!-- ==================== NETWORK (DDP) ==================== -->
  <g transform="translate(280, 100)">
    <!-- WebSocket DDP Connection Line -->
    <path d="M 0,90 Q 145,50 290,90" fill="none" stroke="url(#accent-indigo)" stroke-width="2.5" stroke-dasharray="6,4" />
    <text x="145" y="55" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#a855f7" text-anchor="middle" filter="url(#glow)">
      DDP over WebSockets
    </text>

    <!-- Async Method Call -->
    <path d="M 290,170 L 0,170" fill="none" stroke="#6366f1" stroke-width="2" />
    <!-- Arrow Left to Right -->
    <polygon points="150,165 160,170 150,175" fill="#6366f1" />
    <text x="145" y="160" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#e2e8f0" text-anchor="middle">
      Meteor.callAsync()
    </text>

    <!-- Subscription Stream -->
    <path d="M 0,250 L 290,250" fill="none" stroke="#10b981" stroke-width="2" />
    <!-- Arrow Right to Left -->
    <polygon points="140,245 130,250 140,255" fill="#10b981" />
    <text x="145" y="242" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#10b981" text-anchor="middle">
      Publications Push Stream
    </text>
  </g>

  <!-- ==================== SERVER NODE ==================== -->
  <g transform="translate(570, 100)" filter="url(#shadow)">
    <!-- Container -->
    <rect width="240" height="310" rx="12" fill="url(#server-grad)" stroke="#9333ea" stroke-width="1.5" stroke-opacity="0.6" />
    <!-- Header -->
    <rect width="240" height="40" rx="12" fill="#581c87" />
    <text x="120" y="25" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      Meteor 3.x Server Node
    </text>

    <!-- Subcomponents -->
    <g transform="translate(15, 60)">
      <!-- Async Methods Runner -->
      <rect width="210" height="45" rx="8" fill="#3b0764" stroke="#7e22ce" stroke-width="1" />
      <text x="25" y="27" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Async Methods Registry</text>
      <text x="25" y="39" font-family="'Inter', sans-serif" font-size="9" fill="#c084fc">tasks.insert / tasks.reorder</text>
      <circle cx="15" cy="27" r="4" fill="#a855f7" />

      <!-- Publication Handler -->
      <g transform="translate(0, 55)">
        <rect width="210" height="45" rx="8" fill="#3b0764" stroke="#7e22ce" stroke-width="1" />
        <text x="25" y="27" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">DDP Publications</text>
        <text x="25" y="39" font-family="'Inter', sans-serif" font-size="9" fill="#c084fc">Sorted Cursor Broadcast</text>
        <circle cx="15" cy="27" r="4" fill="#6366f1" />
      </g>

      <!-- Meteor 3 Core runtime -->
      <g transform="translate(0, 110)">
        <rect width="210" height="45" rx="8" fill="#3b0764" stroke="#7e22ce" stroke-width="1" />
        <text x="25" y="27" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Node.js v24 Server</text>
        <text x="25" y="39" font-family="'Inter', sans-serif" font-size="9" fill="#c084fc">Async Context Registry</text>
        <circle cx="15" cy="27" r="4" fill="#ffffff" />
      </g>

      <!-- MongoDB Driver -->
      <g transform="translate(0, 165)">
        <rect width="210" height="45" rx="8" fill="#3b0764" stroke="#7e22ce" stroke-width="1" />
        <text x="25" y="27" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Async Mongo Driver</text>
        <text x="25" y="39" font-family="'Inter', sans-serif" font-size="9" fill="#c084fc">Non-blocking DB Connections</text>
        <circle cx="15" cy="27" r="4" fill="#10b981" />
      </g>
    </g>
  </g>

  <!-- ==================== DATABASE ==================== -->
  <g transform="translate(325, 330)" filter="url(#shadow)">
    <rect width="200" height="80" rx="10" fill="url(#db-grad)" stroke="#059669" stroke-width="1.5" stroke-opacity="0.6" />
    <!-- Header -->
    <rect width="200" height="30" rx="10" fill="#064e3b" />
    <text x="100" y="20" font-family="'Outfit', 'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">
      MongoDB Database
    </text>
    <text x="100" y="55" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">
      Collection: tasks
    </text>
    <text x="100" y="68" font-family="'Inter', sans-serif" font-size="8" fill="#a7f3d0" text-anchor="middle">
      Reactive Oplog Tail Enabled
    </text>
  </g>

  <!-- Server to DB Connection -->
  <path d="M 690,410 L 690,440 L 425,440 L 425,412" fill="none" stroke="#10b981" stroke-width="2" />
  <polygon points="420,418 425,410 430,418" fill="#10b981" />
  <text x="560" y="435" font-family="'Inter', sans-serif" font-size="9" fill="#a7f3d0" text-anchor="middle">
    Async Read/Write
  </text>
</svg>
